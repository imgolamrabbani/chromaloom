<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 256px; height: 256px; background: transparent; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 256px; height: 256px; display: block; }
</style>
</head>
<body>
  <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#1E1B4B" />
      </linearGradient>
      <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F43F5E" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#22D3EE" />
      </linearGradient>
    </defs>
    <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bg)" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="4" />
    <!-- Color wheel ring -->
    <circle cx="128" cy="128" r="70" fill="none" stroke="url(#prism)" stroke-width="26" />
    <!-- Precision eyedropper/contrast center -->
    <circle cx="128" cy="128" r="24" fill="#F8FAFC" />
    <path d="M128 104 A24 24 0 0 1 128 152 Z" fill="#0F172A" />
  </svg>
</body>
</html>
